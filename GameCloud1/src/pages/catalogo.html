<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Cloud: Catálogo de Jogos</title>
    <link rel="stylesheet" href="/css/style.css">
  </head>
  <body>
    <div class="header">
      <img src="/images/logo.png" alt="Logo Game Cloud" class="logo">
      <div class="titulos">
        <a href="/"><h1>Game Cloud</h1></a>
        <h2>Sua Loja de Jogos Digitais</h2>
      </div>

      <a href="/catalogo">Catálogo de Jogos </a>
      <a href="/acessorios">Acessórios</a>

      <div class="carrinho-container">
        <img src="/images/carrinho.png" alt="Logo Carrinho">
        <a href="">Seu Carrinho</a>
      </div>
      
      <div class="login-container">
        <img src="/images/login.png" alt="Logo Log-in">
        <a href="">Log-in</a>
      </div>
    </div>

    <div class="catalogo">
      <h1>Catálogo de Jogos:</h1>
      <div class="acao">
        <h2>Ação e Aventura</h2>
        <div class="acaoimg">
          <img src="/images/arrowesq.png" alt="Seta Esquerda" class="setaesq">
          <img src="/images/tlou2.avif" alt="The Last of Us Part II">
          <img src="/images/reddead.avif" alt="Red Dead Redemption II">
          <img src="/images/uncharted.avif" alt="Uncharted 4: A Thief's End">
          <img src="/images/hollow.png" alt="Hollow Knight">
          <img src="/images/arrowdir.png" alt="Seta Direita" class="setadir">
        </div>
      </div>

      <div class="rpg">
        <h2>RPGs</h2>
        <div class="rpgimg">
          <img src="/images/arrowesq.png" alt="Seta Esquerda" class="setaesq">
          <img src="/images/skyrim.jpg" alt="The Elder Scrolls V: Skyrim">
          <img src="/images/fallout.jpg" alt="Fallout 4">
          <img src="/images/witcher.webp" alt="The Witcher 3: Wild Hunt">
          <img src="/images/elden.webp" alt="Elden Ring">
          <img src="/images/arrowdir.png" alt="Seta Direita" class="setadir">
        </div>

        <div class="vermais">
          <h3>Ver mais</h3>
          <img src="/images/arrowdown.png" alt="Seta Baixo" class="setabaixo">
        </div>
      </div>
    </div>
  </body>
</html>
